name: Deploy GitHub Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-prod:
    name: Prod → /prod/
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate prod config from secrets
        run: |
          printf 'window._GR_CONFIG = {\n  SUPABASE_URL: '"'"'%s'"'"',\n  SUPABASE_ANON_KEY: '"'"'%s'"'"'\n};\n' \
            "${{ secrets.PROD_SUPABASE_URL }}" "${{ secrets.PROD_SUPABASE_ANON_KEY }}" > config.local.js
          rm -f .gitignore

      - name: Deploy Prod to /prod/
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          destination_dir: prod
          keep_files: false

  deploy-dev:
    name: Dev → /dev/
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate dev config from secrets
        run: |
          printf 'window._GR_CONFIG = {\n  SUPABASE_URL: '"'"'%s'"'"',\n  SUPABASE_ANON_KEY: '"'"'%s'"'"'\n};\n' \
            "${{ secrets.DEV_SUPABASE_URL }}" "${{ secrets.DEV_SUPABASE_ANON_KEY }}" > config.local.js
          rm -f .gitignore

      - name: Deploy Dev to /dev/
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          destination_dir: dev
          keep_files: false
