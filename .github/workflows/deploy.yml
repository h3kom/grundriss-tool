name: Deploy GitHub Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-prod:
    name: Prod → /prod/
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject Supabase secrets into constants.js
        run: |
          sed -i "s|__SUPABASE_URL__|${{ secrets.PROD_SUPABASE_URL }}|g" js/constants.js
          sed -i "s|__SUPABASE_ANON_KEY__|${{ secrets.PROD_SUPABASE_ANON_KEY }}|g" js/constants.js

      - name: Create empty config.local.js
        run: echo "// no-op — secrets injected via constants.js" > config.local.js

      - name: Deploy Prod to /prod/
        env:
          DEST_DIR: prod
        run: |
          cd $RUNNER_TEMP
          git clone --branch gh-pages --single-branch "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy
          rm -rf "deploy/${DEST_DIR}" || true
          mkdir -p "deploy/${DEST_DIR}"
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='.github' --exclude='.claude' "${{ github.workspace }}/" "deploy/${DEST_DIR}/"
          cd deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${{ github.sha }}" || true
          git push

  deploy-dev:
    name: Dev → /dev/
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject Supabase secrets into constants.js
        run: |
          sed -i "s|__SUPABASE_URL__|${{ secrets.DEV_SUPABASE_URL }}|g" js/constants.js
          sed -i "s|__SUPABASE_ANON_KEY__|${{ secrets.DEV_SUPABASE_ANON_KEY }}|g" js/constants.js

      - name: Create empty config.local.js
        run: echo "// no-op — secrets injected via constants.js" > config.local.js

      - name: Deploy Dev to /dev/
        env:
          DEST_DIR: dev
        run: |
          cd $RUNNER_TEMP
          git clone --branch gh-pages --single-branch "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy
          rm -rf "deploy/${DEST_DIR}" || true
          mkdir -p "deploy/${DEST_DIR}"
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='.github' --exclude='.claude' "${{ github.workspace }}/" "deploy/${DEST_DIR}/"
          cd deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${{ github.sha }}" || true
          git push
