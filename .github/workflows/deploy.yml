name: Deploy GitHub Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-prod:
    name: Prod → /prod/
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject Supabase secrets into constants.js
        run: |
          sed -i "s|__SUPABASE_URL__|${{ secrets.PROD_SUPABASE_URL }}|g" js/constants.js
          sed -i "s|__SUPABASE_ANON_KEY__|${{ secrets.PROD_SUPABASE_ANON_KEY }}|g" js/constants.js

      - name: Deploy Prod to /prod/
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          destination_dir: prod
          keep_files: false

  deploy-dev:
    name: Dev → /dev/
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject Supabase secrets into constants.js
        run: |
          sed -i "s|__SUPABASE_URL__|${{ secrets.DEV_SUPABASE_URL }}|g" js/constants.js
          sed -i "s|__SUPABASE_ANON_KEY__|${{ secrets.DEV_SUPABASE_ANON_KEY }}|g" js/constants.js

      - name: Deploy Dev to /dev/
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          destination_dir: dev
          keep_files: false
